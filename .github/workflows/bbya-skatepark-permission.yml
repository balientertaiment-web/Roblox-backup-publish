name: BBYA Skatepark Audio Permission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUDIO_KEY: 
      UNIVERSE_ID: '8116636513'
    steps:
      - name: Grant Skatepark audio use to BBYA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error
          ids = [101433831748471,73111765506214,134467357340949,94716486418996,137855682924521,100571973862831,76764826294674,73605786993749,122266407959894,120903123891114,85284576958779,114950574110478,77600449290121,106253638699689]
          key=os.environ.get('AUDIO_KEY','').strip(); universe=os.environ['UNIVERSE_ID']
          report={'bank':'SKATEPARK','universeId':universe,'assetIds':ids,'assetCount':len(ids),'keyPresent':bool(key),'permissionAttempted':False}
          def req(url, method='GET', payload=None, headers=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(url,data=data,headers=headers or {},method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as resp:
                      raw=resp.read().decode('utf-8','replace')
                      return resp.status, json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: body=json.loads(raw) if raw.strip() else {}
                  except Exception: body={'raw':raw[-2000:]}
                  return e.code,body
          if not key:
              report['status']='KEY_MISSING'
          else:
              code,info=req('https://apis.roblox.com/api-keys/v1/introspect','POST',{'apiKey':key},{'Content-Type':'application/json'})
              report['introspectHttp']=code
              report['keyName']=info.get('name') if isinstance(info,dict) else None
              report['authorizedUserId']=str(info.get('authorizedUserId')) if isinstance(info,dict) and info.get('authorizedUserId') is not None else None
              report['scopes']=[{'name':s.get('name'),'operations':s.get('operations') or []} for s in (info.get('scopes') or [])] if isinstance(info,dict) else []
              can_write=any((s.get('name')=='asset-permissions:write') or (s.get('name')=='asset-permissions' and 'write' in (s.get('operations') or [])) for s in report['scopes'])
              report['hasAssetPermissionsWrite']=can_write
              if code!=200 or not can_write:
                  report['status']='NO_ASSET_PERMISSION_SCOPE'
              else:
                  payload={'subjectType':'Universe','subjectId':universe,'action':'Use','requests':[{'assetId':x} for x in ids]}
                  pcode,pbody=req('https://apis.roblox.com/asset-permissions-api/v1/assets/permissions','PATCH',payload,{'x-api-key':key,'Content-Type':'application/json-patch+json'})
                  report['permissionAttempted']=True; report['permissionHttp']=pcode; report['response']=pbody
                  success=[str(x) for x in (pbody.get('successAssetIds') or [])] if isinstance(pbody,dict) else []
                  report['successAssetIds']=success; report['successCount']=len(success)
                  errors=(pbody.get('errors') or []) if isinstance(pbody,dict) else []
                  report['errors']=errors
                  report['status']='GRANTED_ALL' if len(success)==len(ids) else ('PARTIAL' if success else 'FAILED')
          pathlib.Path('bbya-skatepark-permission-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({k:report.get(k) for k in ['status','keyName','authorizedUserId','assetCount','permissionHttp','successCount','hasAssetPermissionsWrite']}))
          PY

      - name: Upload permission result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bbya-skatepark-permission-result
          path: bbya-skatepark-permission-result.json
          if-no-files-found: error
          retention-days: 30
