      - name: Download original audio
        shell: bash
        run: |
          set -euo pipefail

          OUT="$RUNNER_TEMP/original-audio"
          rm -f "$OUT"

          if gdown "https://drive.google.com/uc?id=${DRIVE_FILE_ID}" -O "$OUT"; then
            echo "DOWNLOAD_METHOD=gdown"
          else
            echo "gdown failed; trying direct Drive download"
            rm -f "$OUT"

            curl -fL \
              --retry 3 \
              --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${DRIVE_FILE_ID}&export=download&confirm=t" \
              -o "$OUT" || true
          fi

          if ! test -s "$OUT" || ! ffprobe -v error "$OUT" >/dev/null 2>&1; then
            echo "Trying Google Drive fallback"
            rm -f "$OUT"

            curl -fL \
              --retry 3 \
              --retry-delay 2 \
              "https://drive.google.com/uc?export=download&confirm=t&id=${DRIVE_FILE_ID}" \
              -o "$OUT"
          fi

          test -s "$OUT"

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$OUT"
